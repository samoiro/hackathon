# 로컬 개발용 Postgres. `./gradlew bootRun` 시 Spring Boot가 자동으로 띄우고 연결합니다.
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=hackathon'
      - 'POSTGRES_USER=hackathon'
      - 'POSTGRES_PASSWORD=hackathon'
    ports:
      # 호스트 포트 고정: IntelliJ Database 창에서 localhost:5432 로 붙기 위함
      - '5432:5432'
