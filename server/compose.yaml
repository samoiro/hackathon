# 로컬 개발용 PostgreSQL + PostGIS. `./gradlew bootRun` 시 자동으로 띄우고 연결합니다.
services:
  postgres:
    image: 'postgis/postgis:17-3.5'
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      - 'POSTGRES_DB=hackathon'
      - 'POSTGRES_USER=hackathon'
      - 'POSTGRES_PASSWORD=hackathon'
    ports:
      # 호스트 포트 고정: IntelliJ Database 창에서 localhost:5432 로 붙기 위함
      - '5432:5432'
