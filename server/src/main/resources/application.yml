spring:
  application:
    name: server
  config:
    # 로컬 비밀값은 server/.env 에 (배포 환경에선 Render 환경변수로 주입)
    import: optional:file:.env[.properties]
  datasource:
    # 로컬은 compose.yaml이 자동 연결. 배포(Neon)는 SPRING_DATASOURCE_* 환경변수로 덮어씁니다.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hackathon}
    username: ${PGUSER:hackathon}
    password: ${PGPASSWORD:hackathon}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(src/main/resources/db/migration)가 만든다. Hibernate는 엔티티와 맞는지 검증만
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      thread-name-prefix: batch-
  docker:
    compose:
      lifecycle-management: start-only
  mvc:
    # 에러 응답을 RFC 9457 ProblemDetail(JSON) 형식으로 통일
    problemdetails:
      enabled: true

batch:
  # 최초 실행을 제외한 최대 재시도 횟수 (총 실행 최대 4회)
  max-retry-times: 3
  ingredient-price:
    # 매일 10시(KST). aT는 조사일 다음 날 가격을 공개한다. "-"면 끈다
    cron: ${INGREDIENT_PRICE_CRON:0 0 10 * * *}
  cultural-event:
    # 매일 6시(KST). 서울시 문화행사는 하루 1회 갱신된다. "-"면 끈다
    cron: ${CULTURAL_EVENT_CRON:0 0 6 * * *}

app:
  cors:
    # 쉼표로 구분, 와일드카드 가능 (예: https://*.pages.dev)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

seoul:
  api:
    base-url: ${SEOUL_API_BASE_URL:http://openapi.seoul.go.kr:8088}
    key: ${SEOUL_API_KEY:}

data-go-kr:
  api:
    base-url: ${DATA_GO_KR_API_BASE_URL:https://apis.data.go.kr}
    # 공공데이터포털 "일반 인증키(Decoding)" 값
    key: ${DATA_GO_KR_API_KEY:}

kweather:
  api:
    base-url: ${KWEATHER_API_BASE_URL:https://apigw.kweather.co.kr}
    # api.kweather.co.kr → 내 계정 에서 발급
    key: ${KWEATHER_API_KEY:}

kakao:
  api:
    base-url: ${KAKAO_API_BASE_URL:https://dapi.kakao.com}
    # 카카오 디벨로퍼스 → 내 애플리케이션 → 앱 키의 "REST API 키" (JavaScript 키는 frontend/.env.local)
    key: ${KAKAO_REST_API_KEY:}

# Python ai-server (LLM 추천 생성). 계약: ai-server/docs/API_CONTRACT_DRAFT.md
ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    # ai-server가 공개 URL이라 두 서버가 같은 값을 X-Internal-Token 헤더로 주고받는다
    token: ${AI_SERVER_TOKEN:}
    # LLM 40초 + Render 무료 인스턴스가 깨어나는 시간
    read-timeout: 60s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

server:
  # Render가 주입하는 PORT 사용
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
