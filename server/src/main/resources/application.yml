spring:
  application:
    name: server
  config:
    # 로컬 비밀값은 server/.env 에 (배포 환경에선 Render 환경변수로 주입)
    import: optional:file:.env[.properties]
  datasource:
    # 로컬은 compose.yaml이 자동 연결. 배포(Neon)는 SPRING_DATASOURCE_* 환경변수로 덮어씁니다.
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hackathon}
    username: ${PGUSER:hackathon}
    password: ${PGPASSWORD:hackathon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      lifecycle-management: start-only
  mvc:
    # 에러 응답을 RFC 9457 ProblemDetail(JSON) 형식으로 통일
    problemdetails:
      enabled: true

batch:
  # 최초 실행을 제외한 최대 재시도 횟수 (총 실행 최대 4회)
  max-retry-times: 3

app:
  cors:
    # 쉼표로 구분, 와일드카드 가능 (예: https://*.pages.dev)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

seoul:
  api:
    base-url: ${SEOUL_API_BASE_URL:http://openapi.seoul.go.kr:8088}
    key: ${SEOUL_API_KEY:}

data-go-kr:
  api:
    base-url: ${DATA_GO_KR_API_BASE_URL:https://apis.data.go.kr}
    # 공공데이터포털 "일반 인증키(Decoding)" 값
    key: ${DATA_GO_KR_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

server:
  # Render가 주입하는 PORT 사용
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
